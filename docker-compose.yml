services:
  catalog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    image: jala-cssd-245-qatu-catalog-frontend:local
    container_name: qatu-catalog
    ports:
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
    stop_grace_period: 10s
